[project]
name = "rag-evaluation-system"
version = "0.1.0"
description = "A RAG evaluation harness for measuring answer relevance, faithfulness, context relevance, and correctness."
readme = "README.md"
authors = [
    { name = "Jeevan Parihar", email = "jeevanparihar69@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "pymupdf>=1.28.2",
    "langchain>=1.5.2",
    "langchain-core>=1.8.4",
    "langchain-groq>=1.2.1",
    "langchain-google-genai>=4.5.2",
    "deepeval>=4.3.5",
    "chromadb>=1.5.9",
    "pydantic>=2.14.4",
    "streamlit>=1.67.0",
    "pandas>=3.1.1",
    "plotly>=7.2.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
